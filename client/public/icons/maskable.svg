<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.55" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Fond plein bord à bord : la plateforme applique son propre masque. -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Emblème réduit (~0.78) pour rester dans la zone de sécurité (cercle 80%)
       même après recadrage en cercle/squircle. -->
  <g transform="translate(256,256) scale(0.78) translate(-256,-256)">
    <circle cx="256" cy="256" r="150" fill="url(#gold)" stroke="#b45309" stroke-width="10"/>
    <circle cx="256" cy="256" r="120" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6"/>
    <polygon fill="#ffffff"
      points="256,174 275.98,228.49 333.99,230.66 288.34,266.51 304.19,322.34 256,290 207.81,322.34 223.66,266.51 178.01,230.66 236.02,228.49"/>
  </g>
</svg>
